name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI Trusted Publishing
# (OIDC), so no API token is stored in the repository. One-time setup on
# PyPI: add a trusted publisher for project "airgap-datahub" with
# owner "zelihaguven", repository "airgap", workflow "publish.yml" and
# environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Run the tests from the unpacked sdist
        run: |
          python -m pip install pytest dist/*.whl
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/airgap_datahub-*/
          python -m pytest -q
      - name: Smoke-test the wheel from an empty directory
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          "$RUNNER_TEMP/venv/bin/airgap" audit --no-llm
          test -f outputs/findings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/airgap-datahub/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
